<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>프롬프트 ZZIP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="css/style.css">
<!--BODY-START-->
<header class="hero">
  <div class="hero-glow" aria-hidden="true"></div>
  <p class="hero-eyebrow">수업에서 직접 써 본 프롬프트 모음</p>
  <h1 class="hero-title">필요한 프롬프트,<br>골라서 바로 복사</h1>
  <p class="hero-sub"><b id="totalCount">0</b>개의 프롬프트를 기법별로 정리했어요</p>
  <label class="search" for="q">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="예) 페르소나, 바이어 메일, CoT" autocomplete="off">
  </label>
</header>

<main>
  <section class="groups" aria-labelledby="groupsTitle">
    <h2 id="groupsTitle" class="sec-title">어떤 기법이 필요하세요?</h2>
    <div id="groupList" class="group-list"></div>
  </section>

  <section class="library" id="library" aria-labelledby="libTitle">
    <div class="toolbar">
      <div class="toolbar-row">
        <h2 id="libTitle" class="sec-title sm"><span id="filterName">전체 프롬프트</span> <span class="count" id="resultCount"></span></h2>
        <button type="button" class="reset" id="resetBtn" hidden>전체 보기</button>
      </div>
      <div class="chips" role="group" aria-label="빠른 필터">
        <button type="button" class="chip" data-tag="practice" aria-pressed="false">실습만</button>
        <button type="button" class="chip" data-tag="trade" aria-pressed="false">무역 업무</button>
        <button type="button" class="chip" data-tag="vibe" aria-pressed="false">바이브 코딩</button>
        <button type="button" class="chip" data-tag="Gemini" aria-pressed="false">Gemini</button>
        <button type="button" class="chip" data-tag="Claude" aria-pressed="false">Claude</button>
      </div>
    </div>
    <div id="cardList" class="card-list"></div>
    <p id="empty" class="empty" hidden>찾는 프롬프트가 없어요. 다른 단어로 검색해 보세요.</p>
  </section>
</main>

<footer class="foot">프롬프트 ZZIP · 수업 자료(DAY 1~3)에서 정리</footer>

<dialog id="detail" class="detail" aria-labelledby="dTitle">
  <div class="detail-head">
    <div>
      <p class="detail-chapter" id="dChapter"></p>
      <h3 id="dTitle"></h3>
    </div>
    <button type="button" class="icon-btn" id="dClose" aria-label="닫기">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div id="dParts" class="detail-parts"></div>
  <div class="detail-foot" id="dFoot"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/prompts.js"></script>
<script src="js/app.js"></script>
<!--BODY-END-->

</body></html>
